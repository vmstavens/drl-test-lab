defaults:
  - schema: train_drlr2
  - task: workbench_reach
  - contract: workbench_reach
  - dataset: workbench_processed_v1
  - il: diffusion_policy
  - rl: drlr2_sac
  - runtime: local
  - optional experiment: null
  - _self_

hydra:
  job:
    chdir: false
  run:
    dir: ${runtime.runs_root}/${task.name}/${stage}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${runtime.runs_root}/${task.name}/${stage}/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

recursive:
  resume_from: null
  levels: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]

stage: train_recursive_drlr_rma
