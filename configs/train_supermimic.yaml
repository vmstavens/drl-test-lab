defaults:
  - task: supermimic_reach
  - contract: supermimic_reach
  - supermimic: default
  - runtime: local
  - _self_
stage: train_supermimic
seed: 0
hydra:
  job:
    chdir: false
  run:
    dir: ${runtime.runs_root}/${task.name}/${stage}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${runtime.runs_root}/${task.name}/${stage}/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
