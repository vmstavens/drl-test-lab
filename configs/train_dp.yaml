defaults:
  - schema: train_dp
  - task: workbench_reach
  - contract: workbench_reach
  - dataset: workbench_processed_v1
  - il: diffusion_policy
  - runtime: local
  - optional experiment: null
  - _self_

hydra:
  job:
    chdir: false
  run:
    dir: ${runtime.runs_root}/${task.name}/${stage}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${runtime.runs_root}/${task.name}/${stage}/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
