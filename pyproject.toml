[project]
name = "drl-sys-lab"
version = "0.1.0"
description = "A systems lab for scalable MuJoCo reinforcement-learning infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.4,<1.4",
    "jax==0.10.2",
    "jaxlie>=1.5.0",
    "mjsim",
    "mjxsim",
    "mujoco==3.11.0",
    "mujoco-mjx==3.11.0",
    "numpy>=1.26",
    "brax==0.14.2",
    "flax>=0.12,<0.13",
    "optax>=0.2,<0.3",
    "torch==2.9.1",
    "tensorboard>=2.18,<3",
    "playground>=0.2.0",
]

[tool.uv.sources]
mjsim = { git = "https://github.com/vmstavens/mjsim.git", rev = "cbd400a761a9a13d86b664fe61977c14da17597d" }
mjxsim = { git = "https://github.com/vmstavens/mjxsim.git", rev = "6105fa752210e9e06273314d82248d36a8dbdf25" }

[project.optional-dependencies]
monitoring = ["tensorboard>=2.18,<3"]
publication = ["matplotlib>=3.8,<4", "scipy>=1.15,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
